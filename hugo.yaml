baseurl: https://baka.li
locale: zh-cn
theme: hugo-theme-stack
pagination:
  pagerSize: 5
ignoreErrors:
  - error-front-matter
title: 笨蛋屋
copyright:

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
  zh-cn:
    label: 中文
    title: 笨蛋屋
    weight: 2
    params:
      description: 炒土豆丝のBlog ~ 折腾 · 开车 · 分享 !
services:
  # Change it to your Disqus shortname before using
  disqus:
    shortname: "hugo-theme-stack"
  # GA Tracking ID
  googleAnalytics:
    id:

permalinks:
  post: /:slug
  page: /:slug

params:
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  favicon: /favicon.png

  footer:
    since: 2013
    customText:

  dateFormat:
    published: "2006年01月02日"
    lastUpdated: "2006年01月02日 15:04 CST"

  sidebar: #左边栏
    emoji: 🥔
    subtitle: "炒土豆丝 の Blog !"
    avatar: img/avatar-150px.png

  article:
    math: false
    toc: true
    readingTime: true
    license:
      enabled: false
      default: Licensed under CC BY-NC-SA 4.0

  comments:
    enabled: true
    provider: artalk

    artalk:
      serverUrl: https://artalk.baka.li
      site: 笨蛋屋

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 4
      - type: categories
        params:
          limit: 6
    page:
      - type: toc

  opengraph:
    twitter:
      # Your Twitter username
      site:

      # Available values: summary, summary_large_image
      card: summary_large_image

  defaultImage:
    opengraph:
      enabled: false
      local: false
      src:

  colorScheme:
    # Display toggle
    toggle: true

    # Available values: auto, light, dark
    default: auto

  imageProcessing:
    cover:
      enabled: false
    content:
      enabled: false

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: -100 #权重
      params:
        ### For demonstration purpose, the home link will be open in a new tab
        newTab: false
        icon: home #更多的图标信息见后

    - identifier: about/
      name: About
      url: /about/
      weight: -90
      params:
        ### For demonstration purpose, the home link will be open in a new tab
        newTab: false
        icon: user

    - identifier: archives
      name: Archives
      url: /archives/
      weight: -50
      params:
        ### For demonstration purpose, the home link will be open in a new tab
        newTab: false
        icon: archives

    - identifier: share
      name: Share
      url: https://share.baka.li/
      weight: -50
      params:
        ### For demonstration purpose, the home link will be open in a new tab
        newTab: true
        icon: share

#    - identifier: comments
#      name: Comments
#      url: /comments/
#      weight: -50
#      params:
#        ### For demonstration purpose, the home link will be open in a new tab
#        newTab: false
#        icon: messages

  social:
    - identifier: github
      weight: -70
      name: GitHub
      url: https://github.com/ariakeumi
      params:
        icon: brand-github

    - identifier: twitter
      weight: -60
      name: Twitter
      url: https://x.com/998potato
      params:
        icon: brand-twitter

    - identifier: rss
      weight: -10
      name: RSS
      url: https://baka.li/index.xml
      params:
        icon: rss

    - identifier: serverstutas
      weight: -90
      name: ServerStutas
      url: https://s.baka.li/
      params:
        icon: server-bolt

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100

    - name: categories
      weight: 200

markup:
  goldmark:
    renderer:
      ## Set to true if you have HTML content inside Markdown
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: true
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
